spring:
  application:
    name: crs-backend
  config:
    import: optional:file:./.env[extension=.properties]

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout: ${DEEPSEEK_TIMEOUT:30s}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
